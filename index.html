<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Apex 26</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; color: #e8eaf0; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      #game { display: block; width: 100vw; height: 100vh; }
      #backend { position: fixed; top: 8px; left: 8px; padding: 2px 8px; border-radius: 4px; background: rgb(0 0 0 / 0.5); }
      #hud { position: fixed; inset: auto 16px 16px auto; display: flex; gap: 16px; align-items: flex-end; padding: 8px 12px; border-radius: 8px; background: rgb(0 0 0 / 0.55); font-variant-numeric: tabular-nums; pointer-events: none; }
      #hud[hidden] { display: none; }
      #hud .hud-spd { font-size: 40px; font-weight: 700; line-height: 1; }
      #hud .hud-spd small { font-size: 12px; margin-left: 4px; opacity: 0.7; }
      #hud .hud-gear { font-size: 40px; font-weight: 700; line-height: 1; min-width: 1ch; text-align: center; color: #ffd84a; }
      #hud .hud-times { display: grid; grid-template-columns: auto 8ch; gap: 0 8px; margin: 0; font-size: 14px; }
      #hud .hud-times dt { opacity: 0.6; }
      #hud .hud-times dd { margin: 0; text-align: right; }
      /* Title and pause (src/app/screens.ts). Interim look until lane-data's src/styles tokens land. */
      #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: linear-gradient(180deg, rgb(11 13 18 / 0.6), rgb(11 13 18 / 0.92)); }
      #overlay[hidden] { display: none; }
      .a26-title { margin: 0; font-size: clamp(40px, 9vw, 88px); letter-spacing: 0.08em; font-weight: 800; }
      .a26-doors { display: flex; flex-direction: column; gap: 10px; width: min(420px, calc(100vw - 32px)); }
      .bigbtn { display: block; width: 100%; padding: 14px 18px; border: 1px solid rgb(255 255 255 / 0.18); border-radius: 10px; background: rgb(255 255 255 / 0.06); color: inherit; font: 700 16px/1.2 system-ui, sans-serif; letter-spacing: 0.06em; text-align: left; cursor: pointer; }
      .bigbtn:hover, .bigbtn:focus-visible { background: rgb(225 6 0 / 0.85); border-color: transparent; outline: none; }
      .bigbtn .mb-sub { display: block; margin-top: 2px; font-weight: 500; font-size: 12px; opacity: 0.7; }
      .a26-dialog { border: 0; border-radius: 12px; padding: 20px; min-width: min(360px, calc(100vw - 32px)); background: #151821; color: inherit; }
      .a26-dialog::backdrop { background: rgb(0 0 0 / 0.55); }
      .a26-dialog h2 { margin: 0 0 12px; letter-spacing: 0.08em; }
      .a26-dialog .bigbtn + .bigbtn { margin-top: 8px; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="backend" data-backend="">booting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
